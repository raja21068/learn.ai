name: Deploy to GitHub Pages

# Publishes the site as it is: it is static files, so there is no build step.
# One-time setup: Settings, Pages, Build and deployment, Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Quick check of the shipped data (no browser needed)
        run: |
          for f in tests/credits.test.cjs tests/practice-hub.test.cjs tests/visualize.test.cjs tests/quiz-guessability.test.cjs tests/content-bank.test.cjs; do node "$f"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
